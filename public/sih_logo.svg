<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- Smart India Hackathon stylized vector emblem -->
  <g transform="translate(15, 10)">
    <!-- Outer Glow / Ambient Circle -->
    <circle cx="50" cy="50" r="46" fill="#0f172a" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 2"/>
    
    <!-- Stylized Tri-color Gear / Wheel -->
    <path d="M50 8 A42 42 0 0 1 88 32 L78 38 A30 30 0 0 0 50 20 Z" fill="#ff9933"/>
    <path d="M92 50 A42 42 0 0 1 78 82 L70 72 A30 30 0 0 0 80 50 Z" fill="#ffffff"/>
    <path d="M50 92 A42 42 0 0 1 12 68 L22 62 A30 30 0 0 0 50 80 Z" fill="#138808"/>
    <path d="M8 50 A42 42 0 0 1 22 18 L30 28 A30 30 0 0 0 20 50 Z" fill="#ff9933"/>

    <!-- Lightbulb & Circuit Icon inside -->
    <circle cx="50" cy="50" r="26" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Filament / Idea bulb -->
    <path d="M44 42 C44 36, 56 36, 56 42 C56 46, 53 48, 53 52 L47 52 C47 48, 44 46, 44 42 Z" fill="#fbbf24"/>
    <rect x="47" y="54" width="6" height="3" rx="1" fill="#94a3b8"/>
    <rect x="48" y="58" width="4" height="2" rx="0.5" fill="#64748b"/>
    <!-- Digital nodes / circuit tracks -->
    <circle cx="34" cy="50" r="2.5" fill="#38bdf8"/>
    <line x1="36.5" y1="50" x2="43" y2="50" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="66" cy="50" r="2.5" fill="#38bdf8"/>
    <line x1="63.5" y1="50" x2="57" y2="50" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="50" cy="30" r="2" fill="#fbbf24"/>
    <line x1="50" y1="32" x2="50" y2="36" stroke="#fbbf24" stroke-width="1.5"/>
  </g>

  <!-- Typography -->
  <text x="125" y="42" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="1.5">
    SMART INDIA
  </text>
  <text x="125" y="74" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="900" font-size="26" fill="#ff9933" letter-spacing="2">
    HACKATHON
  </text>
  <rect x="125" y="84" width="220" height="3" rx="1.5" fill="url(#sih-gradient)"/>
  <text x="125" y="102" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="11" fill="#94a3b8" letter-spacing="1">
    GOVERNMENT OF INDIA INITIATIVE
  </text>

  <defs>
    <linearGradient id="sih-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#138808"/>
    </linearGradient>
  </defs>
</svg>
