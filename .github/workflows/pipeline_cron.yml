name: Autonomous 24/7 Satellite & Model Pipeline

on:
  schedule:
    # Runs every 30 minutes, 24/7/365
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase

      - name: Execute Autonomous Pipeline Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_URL || 'https://etvcqmbqmdtiatrqfbxy.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY != '' && secrets.SUPABASE_KEY || 'sb_publishable_KJYaxY4yu7StdTOWyoX__A_sli7UVQt' }}
          MOSDAC_USER: ${{ secrets.MOSDAC_USER != '' && secrets.MOSDAC_USER || 'awesh_21' }}
          MOSDAC_PASS: ${{ secrets.MOSDAC_PASS != '' && secrets.MOSDAC_PASS || 'AH_Since_2006@' }}
        run: |
          python backend/cloud_sync_worker.py
